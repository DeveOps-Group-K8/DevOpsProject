name: Flask CI/CD

on:
  push:
    branches: [Flask_App]
  pull_request:
    branches: [Flask_App]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13  # Use stable version (no postgres:17 yet)
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: number_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 9257postgres
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Wait for Postgres to be ready
      run: |
        until pg_isready -h localhost -U postgres; do
          echo "Waiting for postgres..."
          sleep 2
        done

    - name: Set environment variables
      run: |
        echo "FLASK_APP=app" >> $GITHUB_ENV
        echo "DATABASE_URL=postgresql://postgres:9257postgres@localhost:5432/number_db" >> $GITHUB_ENV

    - name: Run DB migrations
      env:
        DATABASE_URL: postgresql://postgres:9257postgres@localhost:5432/number_db
      run: flask db upgrade

    - name: Run tests
      env:
        DATABASE_URL: postgresql://postgres:9257postgres@localhost:5432/number_db
      run: pytest
