<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .register-container {
            max-width: 450px;
            margin: auto;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container py-5">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} text-center">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <div class="register-container bg-white shadow-sm rounded p-4">
            <h2 class="text-secondary mb-4 text-center">Sign Up</h2>

            <form method="POST" novalidate>
                <div class="mb-3 text-start">
                    <label class="form-label text-muted">Username</label>
                    <input type="text" class="form-control border-light bg-light" name="username" required> 
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label text-muted">Password</label>
                    <input type="password" class="form-control border-light bg-light" name="password" required>
                </div>

                <div class="mb-4 text-start">
                    <label class="form-label text-muted">Confirm Password</label>
                    <input type="password" class="form-control border-light bg-light" name="confirm_password" required>
                </div>

                <button type="submit" class="btn btn-outline-secondary w-100">Register</button>
            </form>

            <p class="mt-3 text-muted text-center">Already have an account? <a href="{{ url_for('main.login') }}">Login</a></p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
