<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    
    <style>
        body {
            background-color: #f8f9fa;
        }

        .login-container {
            max-width: 400px;
            margin: auto;
            margin-top: 5vh;
            padding: 2rem;
        }

        @media (max-width: 576px) {
            .login-container {
                padding: 1rem;
                margin-top: 3vh;
            }
        }
    </style>
</head>
<body>

    <!-- Flash Messages -->
    <div class="container mt-3">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <!-- Login Form -->
    <div class="login-container bg-white shadow-sm rounded">
        <h2 class="text-center text-secondary mb-4">Login</h2>
        <form method="POST">
            <div class="mb-3">
                <input type="text" class="form-control border-light bg-light" name="username" placeholder="Username" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control border-light bg-light" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-outline-secondary w-100">Login</button>
        </form>
        <p class="mt-3 text-center text-muted">
            New here? <a href="{{ url_for('main.register') }}">Register</a>
        </p>
    </div>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
