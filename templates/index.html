<!DOCTYPE html>
<html lang="en">
<head>
    <title>Game App</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        h1 {
            text-align: center;
            margin-top: 20px;
        }
        .section {
            margin-top: 30px;
            padding: 10px;
            background-color: lightskyblue;
        }
        .form-container {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        .box1, .box3 {
            display: none; /* Hide unused boxes on mobile */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Number Guessing Game App</h1>
        <p class="text-center fw-bold">DevOps ⇒ Group K8</p>

        <section class="section">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-8">
                    <div class="form-container">
                        <h2>Welcome to the Number Guessing Game!</h2>
                        <a href="{{ url_for('main.login') }}" class="btn btn-primary m-2">Login</a>
                        <a href="{{ url_for('main.register') }}" class="btn btn-secondary m-2">Register</a>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script> 
</body>
</html>
